# Netlify: build ELUM Browse and serve it as a single-page app.
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in the site's environment variables.
[build]
  command = "node scripts/require-supabase.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every path (/search?q=…, /signin, ...) loads the app, which does its own routing. Real files
# (opensearch.xml, icons, assets) are served as they are.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Searches stay private: no address of the results page goes to the sites people open.
# Google's search element turns away requests that carry no referrer and shows "no results", so
# Browse sends its origin (browsebyelum.netlify.app), never the page or the search: a site opened from
# a result learns at most that it came from Browse.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "interest-cohort=()"

[[headers]]
  for = "/opensearch.xml"
  [headers.values]
    Content-Type = "application/opensearchdescription+xml"
